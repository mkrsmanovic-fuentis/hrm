openapi: 3.1.0

# Conventions for this file (also documented in api-reference/overview.mdx):
# - Paths are written without the /api/v1 base path; it is part of the server URL.
# - Resource URLs are plural kebab-case nouns. A singleton (the current organization) is singular.
# - Every operation has an operationId in camelCase, one tag, and `x-mint: *spec-status`.
# - Errors use the shared responses under components.responses (application/problem+json).
# - List endpoints use the Page and PageSize parameters and return a `<Entity>Page` envelope.
# - Every entity has `id`, `organizationId`, `createdAt` and `updatedAt`.

x-spec-status: &spec-status
  content: |
    <Warning>
      **Specification, not yet implemented.** This endpoint describes what the real backend must do. The current app is a frontend demo running on a mocked API.
    </Warning>

info:
  title: HRM Platform API
  version: 1.0.0
  summary: The contract between the HRM Platform frontend and its future backend.
  description: |
    Specification, not yet implemented. The frontend runs against a mocked API that implements this contract in the browser.

    All requests are scoped to the current organization, which is derived from the session. Organization IDs never appear in URLs.

servers:
  - url: '{origin}/api/v1'
    description: HRM Platform API
    variables:
      origin:
        default: http://localhost:4200
        description: Scheme and host of the deployment. The frontend calls the API on its own origin.

security:
  - sessionToken: []

tags:
  - name: Authentication
    description: Signing in and out, and the current session. Signing in is the only call that needs no session token.
  - name: Organization
    description: The organization the signed-in user belongs to.
  - name: Departments
    description: Groups of employees, such as Engineering or Finance. Administrators manage them.
  - name: Users
    description: Administrator and employee accounts. Administrators manage them on the Employees page.
  - name: Topics
    description: Cybersecurity training subjects, such as Phishing Awareness. Both roles read them; administrators manage them.
  - name: Questionnaires
    description: Sets of multiple-choice questions on one topic, with their settings. Administrators manage them. Employees reach a questionnaire only through their own assignments.

paths:
  /auth/session:
    post:
      operationId: signIn
      tags: [Authentication]
      summary: Sign in
      description: |
        Signs in with email and password and starts a session. Needs no session token; it issues one.

        The session lasts 8 hours from sign-in and is not extended by activity. Send the returned `token` as `Authorization: Bearer <token>` on every other request.

        Only active users who have set a password can sign in. Wrong credentials, an unknown email and a user whose invite is still pending all get the same `401` answer, so the response does not reveal which emails have accounts. A deactivated user who enters the right password gets `403`.
      x-mint: *spec-status
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '201':
          description: Signed in. The new session, with its token and the signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountInactive'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getCurrentSession
      tags: [Authentication]
      summary: Get the current session
      description: Returns the session of the sent token, with the signed-in user. Use it to check that a stored token is still valid.
      x-mint: *spec-status
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: signOut
      tags: [Authentication]
      summary: Sign out
      description: |
        Ends the session of the sent token. The token stops working at once.

        Signing out always succeeds: with a missing, expired or unknown token there is nothing to end, and the answer is still `204`.
      x-mint: *spec-status
      security:
        - sessionToken: []
        - {}
      responses:
        '204':
          description: Signed out.
        '500':
          $ref: '#/components/responses/InternalError'

  /organization:
    get:
      operationId: getCurrentOrganization
      tags: [Organization]
      summary: Get the current organization
      description: |
        Returns the organization the signed-in user belongs to.

        **Access:** administrators and employees.
      x-mint: *spec-status
      responses:
        '200':
          description: The current organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /departments:
    get:
      operationId: listDepartments
      tags: [Departments]
      summary: List departments
      description: |
        Returns the organization's departments, one page at a time, each with its `employeeCount`.

        **Access:** administrators only. Employees get `403`.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Only return departments with this status. Omit to return all departments, active and inactive.
          schema:
            $ref: '#/components/schemas/ActivityStatus'
        - name: q
          in: query
          description: Only return departments whose name contains this text, ignoring upper and lower case. Spaces around the text are ignored.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          description: Sort order. Prefix a field with `-` for descending order.
          schema:
            type: string
            enum: [name, -name, employeeCount, -employeeCount, createdAt, -createdAt]
            default: name
      responses:
        '200':
          description: One page of departments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createDepartment
      tags: [Departments]
      summary: Create a department
      description: |
        Creates an active department. The name must be unique within the organization, among active and inactive departments.

        **Access:** administrators only. Employees get `403`. Logged in the audit log as `created`.
      x-mint: *spec-status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Created. The new department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/NotUnique'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /departments/{departmentId}:
    get:
      operationId: getDepartment
      tags: [Departments]
      summary: Get a department
      description: |
        Returns one department of the current organization, with its `employeeCount`.

        **Access:** administrators only. Employees get `403`.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      responses:
        '200':
          description: The department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateDepartment
      tags: [Departments]
      summary: Update a department
      description: |
        Changes the fields sent and leaves the others as they are. Send `status` to deactivate (`inactive`) or reactivate (`active`) the department; there are no separate endpoints for that.

        Deactivating keeps the department's history, and its employees keep their department.

        **Access:** administrators only. Employees get `403`. Logged in the audit log: changed fields other than `status` as `updated`, then a change of `status` as `deactivated` or `reactivated`. A request that changes nothing logs nothing.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/DepartmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: The updated department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotUnique'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: |
        Returns the organization's users, administrators and employees, one page at a time, each with their training counts.

        **Access:** administrators only. Employees get `403`.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Only return users with this status. Omit to return all users, active and inactive.
          schema:
            $ref: '#/components/schemas/ActivityStatus'
        - name: role
          in: query
          description: Only return users with this role.
          schema:
            $ref: '#/components/schemas/RoleKey'
        - name: departmentId
          in: query
          description: Only return users in this department, active or inactive.
          schema:
            $ref: '#/components/schemas/Id'
        - name: q
          in: query
          description: Only return users whose full name ("first last") or email contains this text, ignoring upper and lower case. Spaces around the text are ignored, and a typographic apostrophe (’) matches a plain one ('), so "o'neill" finds "O’Neill".
          schema:
            type: string
            maxLength: 254
        - name: sort
          in: query
          description: Sort order. Prefix a field with `-` for descending order. `name` sorts by the full name, first name first.
          schema:
            type: string
            enum:
              [
                name,
                -name,
                email,
                -email,
                assignedTrainingCount,
                -assignedTrainingCount,
                completedTrainingCount,
                -completedTrainingCount,
                createdAt,
                -createdAt,
              ]
            default: name
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a user
      description: |
        Creates an active user and sends them an invite link to set a password. `invitationSentAt` is now, `invitationExpiresAt` is 7 days later, and `passwordSetAt` stays `null` until the user sets a password.

        The email must be unique within the organization, among active and inactive users, ignoring upper and lower case and spaces around it. Only an active department can be chosen.

        **Access:** administrators only. Employees get `403`. Logged in the audit log as `created`.
      x-mint: *spec-status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created. The new user, with the invite fields set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/NotUnique'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user
      description: |
        Returns one user of the current organization, with their training counts.

        **Access:** administrators only. Employees get `403`.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user
      description: |
        Changes the fields sent and leaves the others as they are. Send `status` to deactivate (`inactive`) or reactivate (`active`) the user; there are no separate endpoints for that.

        - **Deactivating** ends the user's sessions at once: their next request gets `401`, and they cannot sign in. Their training results are kept. Their open assignments stay unchanged, but are left out of pending and overdue counts.
        - **Reactivating** lets the user sign in again, and their open assignments count as pending and overdue again.
        - **Department:** only an active department can be chosen. A user already in a department that was deactivated later keeps it, so sending their current `departmentId` again is accepted.
        - **Own account:** administrators cannot deactivate themselves or change their own role. Both answer `409`.

        **Access:** administrators only. Employees get `403`. Logged in the audit log: changed fields other than `status` as `updated`, then a change of `status` as `deactivated` or `reactivated`. A request that changes nothing logs nothing.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The email is already used by another user: `errors` names `email` with code `not_unique`. Or an administrator tried to deactivate themselves or change their own role: no `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
              examples:
                emailInUse:
                  summary: Email already in use
                  value:
                    type: /problems/conflict
                    title: Conflict
                    status: 409
                    detail: A user with the email oliver.grant@brightwater.example already exists.
                    errors:
                      - location: body
                        field: email
                        code: not_unique
                        message: A user with this email already exists.
                ownAccount:
                  summary: Deactivating your own account
                  value:
                    type: /problems/conflict
                    title: Conflict
                    status: 409
                    detail: You cannot deactivate your own account.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /topics:
    get:
      operationId: listTopics
      tags: [Topics]
      summary: List topics
      description: |
        Returns the organization's topics, one page at a time, each with its `questionnaireCount`.

        **Access:** administrators and employees. Administrators get every topic. Employees get only active topics, so `status=inactive` returns an empty list for them.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Only return topics with this status. Omit to return all topics, active and inactive. Employees only ever get active topics.
          schema:
            $ref: '#/components/schemas/ActivityStatus'
        - name: q
          in: query
          description: Only return topics whose name contains this text, ignoring upper and lower case. Spaces around the text are ignored.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          description: Sort order. Prefix a field with `-` for descending order.
          schema:
            type: string
            enum: [name, -name, questionnaireCount, -questionnaireCount, createdAt, -createdAt]
            default: name
      responses:
        '200':
          description: One page of topics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTopic
      tags: [Topics]
      summary: Create a topic
      description: |
        Creates an active topic. The name must be unique within the organization, among active and inactive topics, ignoring upper and lower case.

        **Access:** administrators only. Employees get `403`. Logged in the audit log as `created`.
      x-mint: *spec-status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicCreate'
      responses:
        '201':
          description: Created. The new topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/NotUnique'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /topics/{topicId}:
    get:
      operationId: getTopic
      tags: [Topics]
      summary: Get a topic
      description: |
        Returns one topic of the current organization, with its `questionnaireCount`.

        **Access:** administrators and employees. An inactive topic answers `404` to employees, as if it did not exist.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/TopicId'
      responses:
        '200':
          description: The topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateTopic
      tags: [Topics]
      summary: Update a topic
      description: |
        Changes the fields sent and leaves the others as they are. Send `status` to deactivate (`inactive`) or reactivate (`active`) the topic; there are no separate endpoints for that.

        Deactivating keeps the topic's history and its questionnaires' results. Its questionnaires are not changed.

        **Access:** administrators only. Employees get `403`. Logged in the audit log: changed fields other than `status` as `updated`, then a change of `status` as `deactivated` or `reactivated`. A request that changes nothing logs nothing.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/TopicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicUpdate'
      responses:
        '200':
          description: The updated topic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotUnique'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /questionnaires:
    get:
      operationId: listQuestionnaires
      tags: [Questionnaires]
      summary: List questionnaires
      description: |
        Returns the organization's questionnaires, active and inactive, one page at a time, each with its `questionCount`.

        **Access:** administrators only. Employees get `403`: they reach questionnaires only through their own assignments.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          description: Only return questionnaires with this status. Omit to return all questionnaires, active and inactive.
          schema:
            $ref: '#/components/schemas/ActivityStatus'
        - name: topicId
          in: query
          description: Only return questionnaires in this topic.
          schema:
            $ref: '#/components/schemas/Id'
        - name: q
          in: query
          description: Only return questionnaires whose title contains this text, ignoring upper and lower case. Spaces around the text are ignored.
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          description: Sort order. Prefix a field with `-` for descending order.
          schema:
            type: string
            enum:
              [
                title,
                -title,
                questionCount,
                -questionCount,
                passingScore,
                -passingScore,
                createdAt,
                -createdAt,
              ]
            default: title
      responses:
        '200':
          description: One page of questionnaires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnairePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createQuestionnaire
      tags: [Questionnaires]
      summary: Create a questionnaire
      description: |
        Creates an **inactive** questionnaire, a draft, with an empty version 1 as its `currentVersionId`. Add questions, then activate it with `PATCH`.

        The topic must exist and be active. Titles do not have to be unique.

        **Access:** administrators only. Employees get `403`. Logged in the audit log as `created`.
      x-mint: *spec-status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireCreate'
      responses:
        '201':
          description: Created. The new, inactive questionnaire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questionnaire'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /questionnaires/{questionnaireId}:
    get:
      operationId: getQuestionnaire
      tags: [Questionnaires]
      summary: Get a questionnaire
      description: |
        Returns one questionnaire of the current organization, with its settings and `questionCount`.

        **Access:** administrators only. Employees get `403`.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/QuestionnaireId'
      responses:
        '200':
          description: The questionnaire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questionnaire'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateQuestionnaire
      tags: [Questionnaires]
      summary: Update a questionnaire
      description: |
        Changes the settings sent and leaves the others as they are. Send `status` to activate (`active`) or deactivate (`inactive`) the questionnaire; there are no separate endpoints for that.

        - Changing the settings does not create a new version. Each attempt keeps the passing score it started with, so a new passing score never changes earlier results.
        - A questionnaire cannot be moved into an inactive topic. Sending the topic it is already in is not a move.
        - Activating needs at least one question in the current version. Otherwise the answer is `409` and nothing changes.
        - An inactive questionnaire cannot be assigned. Deactivating does not change existing assignments; they can still be completed.

        **Access:** administrators only. Employees get `403`. Logged in the audit log: changed fields other than `status` as `updated`, then a change of `status` as `deactivated` or `reactivated`. A request that changes nothing logs nothing.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/QuestionnaireId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireUpdate'
      responses:
        '200':
          description: The updated questionnaire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Questionnaire'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotReadyToActivate'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /questionnaires/{questionnaireId}/questions:
    get:
      operationId: getQuestionnaireQuestions
      tags: [Questionnaires]
      summary: Get the questions
      description: |
        Returns the questionnaire's **current version**, with its questions and their answer options in display order, including which answer is correct. `attemptCount` says how many attempts use this version, so an editor can tell whether saving will create a new version.

        **Access:** administrators only. Employees get `403`: they never get correct answers from this endpoint.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/QuestionnaireId'
      responses:
        '200':
          description: The current version with its questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceQuestionnaireQuestions
      tags: [Questionnaires]
      summary: Save the questions
      description: |
        Replaces the questions of the questionnaire with the ordered list sent: the whole list at once, in display order. Questions and answer options get their `position` from their place in the list.

        - **No attempts on the current version:** the questions of the current version are replaced in place. `currentVersionId` stays the same.
        - **Attempts on the current version** (in progress or submitted): a **new version** is created with the questions sent, its `versionNumber` one higher than the latest, and `currentVersionId` points to it. Earlier versions, their questions and their attempts never change. An attempt in progress finishes on the version it started with; new attempts use the new version.
        - **Nothing changed:** when the list sent equals the current questions, nothing is saved, no version is created and nothing is logged.
        - Question and answer option IDs are assigned by the server on every save. Do not rely on them staying the same.

        Every question needs text, and every answer option needs text. An **active** questionnaire must also stay valid: at least one question, and for each question at least two answer options with exactly one correct. A save that breaks this answers `422`, with field names such as `questions[2].answerOptions`. An **inactive** questionnaire, a draft, may be saved incomplete.

        **Access:** administrators only. Employees get `403`. Logged in the audit log as `updated` on the questionnaire, listing `questions` with the questions before and after, and `currentVersionId` when a new version was created.
      x-mint: *spec-status
      parameters:
        - $ref: '#/components/parameters/QuestionnaireId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionnaireQuestionsUpdate'
      responses:
        '200':
          description: The current version after the save, with its questions. A new version when one was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        Session token issued by the authentication endpoints under `/auth` (email and password in the MVP, SSO later).
        Send it on every request as `Authorization: Bearer <token>`. The rest of the API only knows the token, never how it was obtained.

  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    DepartmentId:
      name: departmentId
      in: path
      required: true
      description: ID of the department.
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: userId
      in: path
      required: true
      description: ID of the user.
      schema:
        $ref: '#/components/schemas/Id'
    TopicId:
      name: topicId
      in: path
      required: true
      description: ID of the topic.
      schema:
        $ref: '#/components/schemas/Id'
    QuestionnaireId:
      name: questionnaireId
      in: path
      required: true
      description: ID of the questionnaire.
      schema:
        $ref: '#/components/schemas/Id'

  responses:
    BadRequest:
      description: The request could not be read, for example because the body is not valid JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/bad-request
            title: Bad request
            status: 400
            detail: The request body is not valid JSON.
    InvalidCredentials:
      description: The email and password do not match an active account that can sign in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/invalid-credentials
            title: Wrong email or password
            status: 401
            detail: The email or password is wrong.
    AccountInactive:
      description: The email and password are right, but the account is deactivated. Deactivated users cannot sign in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/account-inactive
            title: Account deactivated
            status: 403
            detail: This account is deactivated. Ask an administrator to reactivate it.
    Unauthenticated:
      description: No valid session token was sent. The user must sign in.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/unauthenticated
            title: Not signed in
            status: 401
            detail: Sign in to continue.
    Forbidden:
      description: The user is signed in, but their role is not allowed to do this, for example an employee calling an administrator endpoint. See the access rules in the business rules.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/forbidden
            title: Access denied
            status: 403
            detail: You do not have permission to do this.
    NotFound:
      description: The resource does not exist in the current organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not-found
            title: Not found
            status: 404
            detail: Topic 2f0c1a7e-3b6d-4c1e-9f7a-5d2e8b4c6a10 was not found.
    Conflict:
      description: The request conflicts with the current state, for example assigning a questionnaire the employee already has open.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/conflict
            title: Conflict
            status: 409
            detail: The employee already has an open assignment for this questionnaire.
    NotUnique:
      description: |
        A field that must be unique has a value another record already uses, for example a department name. `errors` names the field, with code `not_unique`, so a form can show the message next to it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblem'
          example:
            type: /problems/conflict
            title: Conflict
            status: 409
            detail: A department named Finance already exists.
            errors:
              - location: body
                field: name
                code: not_unique
                message: A department with this name already exists.
    NotReadyToActivate:
      description: |
        The questionnaire cannot be activated yet, for example because its current version has no questions. Nothing was changed. `detail` says what is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/conflict
            title: Conflict
            status: 409
            detail: Add at least one question before activating this questionnaire.
    ValidationFailed:
      description: One or more request fields are invalid. Each problem is listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: /problems/validation-failed
            title: Validation failed
            status: 422
            detail: 1 field is invalid.
            errors:
              - location: query
                field: pageSize
                code: out_of_range
                message: Must be between 1 and 100.
    InternalError:
      description: Something went wrong on the server.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/internal-error
            title: Something went wrong
            status: 500
            detail: Try again later.

  schemas:
    # ---------------------------------------------------------------- shared

    Id:
      type: string
      format: uuid
      description: Unique identifier (UUID).
      examples: [2f0c1a7e-3b6d-4c1e-9f7a-5d2e8b4c6a10]

    Timestamp:
      type: string
      format: date-time
      description: Date and time in UTC, in ISO 8601 format.
      examples: ['2026-11-10T09:30:00Z']

    ActivityStatus:
      type: string
      enum: [active, inactive]
      description: Whether the record is in use. Inactive records keep their history.

    PassingScore:
      type: integer
      minimum: 1
      maximum: 100
      default: 80
      description: Minimum score, in percent, needed to pass. Whole number from 1 to 100. Defaults to 80.

    Score:
      type: number
      minimum: 0
      maximum: 100
      description: Exact score in percent, `correct answers / total questions × 100`. Compare the exact value with the passing score; show it rounded down.
      examples: [79.6]

    PageInfo:
      type: object
      description: Position of a page within the full result.
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
          description: Current page number, starting at 1.
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested number of items per page.
        totalItems:
          type: integer
          minimum: 0
          description: Number of items across all pages.
        totalPages:
          type: integer
          minimum: 0
          description: Number of pages. 0 when there are no items.

    Problem:
      type: object
      description: Error details in the RFC 9457 problem format, sent as `application/problem+json`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: Identifies the kind of problem, for example `/problems/not-found`. Clients branch on this value.
        title:
          type: string
          description: Short, human-readable summary of the problem kind.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: The request path that caused the problem.

    ValidationProblem:
      description: A problem with a list of invalid fields.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'

    ConflictProblem:
      description: A `409` problem. When the conflict is about a field, such as a duplicate name, `errors` names it.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      description: One invalid field in a request.
      required: [location, field, code, message]
      properties:
        location:
          type: string
          enum: [body, query, path, header]
          description: Where the field was sent.
        field:
          type: string
          description: Name of the field. Nested body fields use dots and indexes, for example `questions[2].text`.
        code:
          type: string
          description: |
            Machine-readable reason. Known codes: `required`, `invalid_type`, `invalid_format`, `invalid_value`,
            `out_of_range`, `too_short`, `too_long`, `not_unique`.
        message:
          type: string
          description: Human-readable explanation, safe to show next to the field.

    # ---------------------------------------------------------------- authentication

    SignInRequest:
      type: object
      description: Credentials for signing in with email and password.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Sign-in email address. Matched without regard to upper and lower case.
          examples: [maja.novak@brightwater.example]
        password:
          type: string
          minLength: 1
          maxLength: 200
          description: The user's password.

    Session:
      type: object
      description: A signed-in session. It lasts 8 hours from sign-in and is not extended by activity.
      required: [token, createdAt, expiresAt, user]
      properties:
        token:
          type: string
          minLength: 1
          description: 'Opaque session token. Send it as `Authorization: Bearer <token>`. Treat it as a secret.'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the user signed in.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the session ends, 8 hours after `createdAt`. After that, the token gets `401`.
        user:
          $ref: '#/components/schemas/User'
          description: The signed-in user.

    # ---------------------------------------------------------------- organization and people

    Organization:
      type: object
      description: Owns all other records. The MVP has one organization, exposed as the current organization.
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name of the organization.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    RoleKey:
      type: string
      enum: [administrator, employee]
      description: Stable key of a role. The MVP has one Administrator role with full access and one Employee role.

    Role:
      type: object
      description: Permissions for a kind of user. Users reference a role by its key.
      required: [id, organizationId, key, name, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        key:
          $ref: '#/components/schemas/RoleKey'
        name:
          type: string
          description: Display name, for example "Administrator".
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    User:
      type: object
      description: An administrator or employee account.
      required:
        [
          id,
          organizationId,
          email,
          firstName,
          lastName,
          role,
          departmentId,
          status,
          invitationSentAt,
          invitationExpiresAt,
          passwordSetAt,
          lastSignedInAt,
          assignedTrainingCount,
          completedTrainingCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          maxLength: 254
          description: Sign-in email address. Unique within the organization.
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/RoleKey'
        departmentId:
          description: Department the user belongs to, if any.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: Inactive users cannot sign in, and deactivating a user ends their sessions at once. Their open assignments stay but are left out of pending and overdue counts.
        invitationSentAt:
          description: When the latest invite link was sent. Null once the password is set.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        invitationExpiresAt:
          description: When the latest invite link expires, 7 days after it was sent. Null once the password is set.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        passwordSetAt:
          description: When the user set a password through the invite link. Null while the invite is pending.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lastSignedInAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        assignedTrainingCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Derived. Every assignment the user has received, in any status, passed ones included. Open assignments of a deactivated user still count. Never sent in requests.
        completedTrainingCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Derived. The user's assignments with the status `passed`, including ones passed after the deadline. Never sent in requests.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    UserPage:
      type: object
      description: One page of users.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageInfo'

    UserCreate:
      type: object
      description: A new user. They start active, with an invite link to set a password. Spaces around text fields are removed. Unknown fields are rejected.
      required: [email, firstName, lastName, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Unique within the organization, among active and inactive users, ignoring upper and lower case and spaces around it.
          examples: [hana.sato@brightwater.example]
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/RoleKey'
        departmentId:
          description: An active department, or `null` for no department. Left out means no department.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'

    UserUpdate:
      type: object
      description: The fields to change. Fields left out stay as they are. Spaces around text fields are removed. Unknown fields are rejected.
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Unique within the organization, among active and inactive users, ignoring upper and lower case and spaces around it.
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/RoleKey'
          description: Administrators cannot change their own role.
        departmentId:
          description: An active department, or `null` for no department. The user's current department is also accepted when it is inactive.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: '`inactive` deactivates the user and ends their sessions, `active` reactivates them. Administrators cannot deactivate themselves.'

    Department:
      type: object
      description: Groups employees.
      required: [id, organizationId, name, description, status, employeeCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the organization, ignoring upper and lower case.
        description:
          type: ['string', 'null']
          maxLength: 500
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: Inactive departments keep their history, and their employees keep their department.
        employeeCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Derived. The number of active users whose `departmentId` is this department. Never sent in requests.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    DepartmentPage:
      type: object
      description: One page of departments.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        page:
          $ref: '#/components/schemas/PageInfo'

    DepartmentCreate:
      type: object
      description: A new department. It starts active. Spaces around the name and description are removed, and an empty description is stored as `null`. Unknown fields are rejected.
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the organization, ignoring upper and lower case.
          examples: [Finance]
        description:
          type: ['string', 'null']
          maxLength: 500

    DepartmentUpdate:
      type: object
      description: The fields to change. Fields left out stay as they are. Spaces around the name and description are removed, and an empty description is stored as `null`. Unknown fields are rejected.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the organization, ignoring upper and lower case.
        description:
          type: ['string', 'null']
          maxLength: 500
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: '`inactive` deactivates the department, `active` reactivates it.'

    # ---------------------------------------------------------------- training content

    TopicIcon:
      type: string
      description: A Lucide icon name from the curated list of security icons the app can show. Administrators pick one; other names are rejected.
      enum:
        - fish
        - key-round
        - lock
        - shield-check
        - database
        - file-lock
        - eye-off
        - users
        - globe
        - wifi
        - network
        - cloud
        - laptop
        - smartphone
        - usb
        - house
        - bug

    Topic:
      type: object
      description: A cybersecurity training subject, such as Phishing Awareness. A topic contains questionnaires.
      required: [id, organizationId, name, description, icon, status, questionnaireCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the organization, among active and inactive topics, ignoring upper and lower case.
        description:
          type: string
          minLength: 1
          maxLength: 1000
        icon:
          description: Optional icon, a Lucide icon name from the curated list. `null` when the topic has none.
          oneOf:
            - $ref: '#/components/schemas/TopicIcon'
            - type: 'null'
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: Inactive topics keep their history and their questionnaires' results. Employees do not see them.
        questionnaireCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Derived. The number of questionnaires in the topic, active and inactive. Never sent in requests.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    TopicPage:
      type: object
      description: One page of topics.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        page:
          $ref: '#/components/schemas/PageInfo'

    TopicCreate:
      type: object
      description: A new topic. It starts active. Spaces around the name and description are removed. Unknown fields are rejected.
      required: [name, description]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the organization, among active and inactive topics, ignoring upper and lower case.
          examples: [Phishing Awareness]
        description:
          type: string
          minLength: 1
          maxLength: 1000
        icon:
          description: Optional. Omit it or send `null` for no icon.
          oneOf:
            - $ref: '#/components/schemas/TopicIcon'
            - type: 'null'

    TopicUpdate:
      type: object
      description: The fields to change. Fields left out stay as they are. Spaces around the name and description are removed. Unknown fields are rejected.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique within the organization, among active and inactive topics, ignoring upper and lower case.
        description:
          type: string
          minLength: 1
          maxLength: 1000
        icon:
          description: Send `null` to remove the icon.
          oneOf:
            - $ref: '#/components/schemas/TopicIcon'
            - type: 'null'
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: '`inactive` deactivates the topic, `active` reactivates it. Its questionnaires are not changed.'

    Questionnaire:
      type: object
      description: |
        A set of questions on one topic, with its settings. The questions live in versions. A new questionnaire starts inactive, as a draft, with an empty version 1.
      required:
        [
          id,
          organizationId,
          topicId,
          title,
          description,
          passingScore,
          timeLimitMinutes,
          status,
          currentVersionId,
          questionCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        topicId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Not unique. Two questionnaires may have the same title, for example in different topics.
        description:
          type: ['string', 'null']
          maxLength: 2000
          description: Optional. `null` when there is none.
        passingScore:
          $ref: '#/components/schemas/PassingScore'
        timeLimitMinutes:
          $ref: '#/components/schemas/TimeLimitMinutes'
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: A new questionnaire is inactive. Inactive questionnaires cannot be assigned. Existing assignments can still be completed.
        currentVersionId:
          $ref: '#/components/schemas/Id'
          description: The latest version. New attempts use it. Set by the server; changing the settings does not create a new version.
        questionCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Derived. Number of questions in the current version. Never sent in requests.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    TimeLimitMinutes:
      type: ['integer', 'null']
      minimum: 1
      maximum: 480
      description: Optional time limit in whole minutes, from 1 to 480 (8 hours, the length of a session). When it runs out, the attempt is submitted automatically. `null` means no limit.

    QuestionnairePage:
      type: object
      description: One page of questionnaires.
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Questionnaire'
        page:
          $ref: '#/components/schemas/PageInfo'

    QuestionnaireCreate:
      type: object
      description: |
        A new questionnaire. It starts inactive, with an empty version 1; activate it with `PATCH` once it has questions. Spaces around the title and description are removed, and an empty description is stored as `null`. Unknown fields are rejected.
      required: [title, topicId]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          examples: [Spotting phishing emails]
        description:
          type: ['string', 'null']
          maxLength: 2000
        topicId:
          $ref: '#/components/schemas/Id'
          description: An active topic. An inactive or unknown topic is rejected with `422`.
        passingScore:
          $ref: '#/components/schemas/PassingScore'
          description: Whole number from 1 to 100. Omit it for the default, 80.
        timeLimitMinutes:
          $ref: '#/components/schemas/TimeLimitMinutes'
          description: Omit it or send `null` for no time limit.

    QuestionnaireUpdate:
      type: object
      description: |
        The fields to change. Fields left out stay as they are. Spaces around the title and description are removed, and an empty description is stored as `null`. Changing these settings does not create a new version. Unknown fields are rejected.
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ['string', 'null']
          maxLength: 2000
        topicId:
          $ref: '#/components/schemas/Id'
          description: Moves the questionnaire to another topic. The new topic must be active; sending the current topic is always allowed.
        passingScore:
          $ref: '#/components/schemas/PassingScore'
          description: Applies to attempts started from now on. Each attempt keeps the passing score it started with.
        timeLimitMinutes:
          $ref: '#/components/schemas/TimeLimitMinutes'
          description: Send `null` to remove the time limit.
        status:
          $ref: '#/components/schemas/ActivityStatus'
          description: '`active` activates the questionnaire and needs at least one question (`409` otherwise). `inactive` deactivates it: it can no longer be assigned, and existing assignments can still be completed.'

    QuestionnaireVersion:
      type: object
      description: |
        A snapshot of a questionnaire's questions. A questionnaire with no attempts is edited in place.
        Editing one that has attempts creates a new version. Each attempt stays linked to the version it used.
      required:
        [id, organizationId, questionnaireId, versionNumber, questions, attemptCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        questionnaireId:
          $ref: '#/components/schemas/Id'
        versionNumber:
          type: integer
          minimum: 1
          description: Starts at 1 and goes up by one for each new version.
        questions:
          type: array
          description: Questions in display order.
          items:
            $ref: '#/components/schemas/Question'
        attemptCount:
          type: integer
          minimum: 0
          readOnly: true
          description: Derived. Attempts that use this version, in progress and submitted. When it is above 0, saving questions creates a new version. Never sent in requests.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    QuestionnaireQuestionsUpdate:
      type: object
      description: |
        The complete, ordered list of questions for the questionnaire. It replaces the current questions; see `PUT /questionnaires/{questionnaireId}/questions` for when that creates a new version. Spaces around text are removed, and an empty explanation is stored as `null`. Unknown fields are rejected.
      required: [questions]
      additionalProperties: false
      properties:
        questions:
          type: array
          description: Questions in display order. An active questionnaire needs at least one; an inactive draft may send none.
          items:
            $ref: '#/components/schemas/QuestionInput'

    QuestionInput:
      type: object
      description: One question as the editor sends it. Its position is its place in the list.
      required: [text, answerOptions]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000
        explanation:
          type: ['string', 'null']
          maxLength: 2000
          description: Optional feedback shown when the question is answered wrong. Omit it or send `null` or empty text for none.
        answerOptions:
          type: array
          description: Answer options in display order. An active questionnaire needs at least two, with exactly one correct. An inactive draft may send fewer, or none marked correct.
          items:
            $ref: '#/components/schemas/AnswerOptionInput'

    AnswerOptionInput:
      type: object
      description: One answer option as the editor sends it. Its position is its place in the list.
      required: [text, isCorrect]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        isCorrect:
          type: boolean
          description: Whether this is the correct answer.

    Question:
      type: object
      description: One multiple-choice question with exactly one correct answer. Every question is required.
      required: [id, organizationId, questionnaireVersionId, position, text, explanation, answerOptions, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        questionnaireVersionId:
          $ref: '#/components/schemas/Id'
        position:
          type: integer
          minimum: 1
          description: Display order within the version, starting at 1.
        text:
          type: string
          minLength: 1
          maxLength: 1000
        explanation:
          type: ['string', 'null']
          maxLength: 2000
          description: Optional feedback shown when the question is answered wrong.
        answerOptions:
          type: array
          description: Possible answers in display order. At least two, with exactly one correct, in an active questionnaire. A question in an inactive draft may still be incomplete.
          items:
            $ref: '#/components/schemas/AnswerOption'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AnswerOption:
      type: object
      description: A possible answer to a question.
      required: [id, organizationId, questionId, position, text, isCorrect, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        questionId:
          $ref: '#/components/schemas/Id'
        position:
          type: integer
          minimum: 1
          description: Display order within the question, starting at 1.
        text:
          type: string
          minLength: 1
          maxLength: 500
        isCorrect:
          type: boolean
          description: |
            Whether this is the correct answer. Sent to administrators. Employees receive it only for a questionnaire
            they passed; after a failed attempt they see which questions were wrong, not the correct answers.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    # ---------------------------------------------------------------- training

    AssignmentStatus:
      type: string
      enum: [not_started, in_progress, passed, failed, overdue]
      description: |
        Derived, evaluated in this order: `passed` if any attempt passed, even after the deadline; otherwise `overdue`
        if the deadline has passed; otherwise `failed`, `in_progress` or `not_started`, based on the latest attempt.

    Assignment:
      type: object
      description: Links a questionnaire to an employee, with a deadline.
      required:
        [
          id,
          organizationId,
          questionnaireId,
          userId,
          assignedById,
          dueAt,
          status,
          attemptCount,
          latestScore,
          completedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        questionnaireId:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
          description: The employee who must complete the questionnaire.
        assignedById:
          $ref: '#/components/schemas/Id'
          description: The administrator who created the assignment.
        dueAt:
          $ref: '#/components/schemas/Timestamp'
          description: Deadline. After it passes, an assignment that is not passed is overdue.
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        attemptCount:
          type: integer
          minimum: 0
          readOnly: true
        latestScore:
          readOnly: true
          description: Score of the latest submitted attempt. Null when no attempt is submitted.
          oneOf:
            - $ref: '#/components/schemas/Score'
            - type: 'null'
        completedAt:
          readOnly: true
          description: When the passing attempt was submitted. Null until passed.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the questionnaire was assigned.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AttemptStatus:
      type: string
      enum: [in_progress, submitted]
      description: An assignment has at most one attempt in progress.

    SubmissionType:
      type: string
      enum: [employee, time_limit]
      description: '`employee` when the employee submitted, `time_limit` when the time limit ran out and the attempt was submitted automatically.'

    Attempt:
      type: object
      description: One try at completing an assignment, on one questionnaire version. Submitted attempts are never changed or deleted.
      required:
        [
          id,
          organizationId,
          assignmentId,
          questionnaireVersionId,
          attemptNumber,
          status,
          startedAt,
          expiresAt,
          submittedAt,
          submissionType,
          passingScore,
          questionCount,
          correctCount,
          score,
          passed,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        assignmentId:
          $ref: '#/components/schemas/Id'
        questionnaireVersionId:
          $ref: '#/components/schemas/Id'
          description: The version the attempt started on. It finishes on the same version.
        attemptNumber:
          type: integer
          minimum: 1
          description: 1 for the first attempt of the assignment, then counting up.
        status:
          $ref: '#/components/schemas/AttemptStatus'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          description: When the time limit runs out. Null when the questionnaire has no time limit.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        submittedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        submissionType:
          oneOf:
            - $ref: '#/components/schemas/SubmissionType'
            - type: 'null'
        passingScore:
          $ref: '#/components/schemas/PassingScore'
          description: The questionnaire's passing score when the attempt started, so later changes do not alter the result.
        questionCount:
          type: integer
          minimum: 1
          description: Number of questions in the version.
        correctCount:
          type: ['integer', 'null']
          minimum: 0
          description: Correct answers. Null until submitted. Unanswered questions count as wrong.
        score:
          description: Null until submitted.
          oneOf:
            - $ref: '#/components/schemas/Score'
            - type: 'null'
        passed:
          type: ['boolean', 'null']
          description: True when the exact score is equal to or greater than the passing score. Null until submitted.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AttemptAnswer:
      type: object
      description: The answer chosen for one question in an attempt.
      required: [id, organizationId, attemptId, questionId, answerOptionId, isCorrect, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        attemptId:
          $ref: '#/components/schemas/Id'
        questionId:
          $ref: '#/components/schemas/Id'
        answerOptionId:
          description: The chosen option. Null when the time limit ran out before the question was answered.
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        isCorrect:
          type: ['boolean', 'null']
          description: Null until the attempt is submitted.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the answer was last changed.

    # ---------------------------------------------------------------- notifications and audit

    NotificationType:
      type: string
      enum: [assignment_created, deadline_reminder]
      description: '`assignment_created` when training is assigned; `deadline_reminder` 3 days before the deadline, unless already passed.'

    Notification:
      type: object
      description: An in-app message to an employee. The app builds the text from the type and the linked assignment.
      required: [id, organizationId, userId, type, assignmentId, readAt, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        userId:
          $ref: '#/components/schemas/Id'
          description: The recipient.
        type:
          $ref: '#/components/schemas/NotificationType'
        assignmentId:
          $ref: '#/components/schemas/Id'
        readAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    AuditAction:
      type: string
      enum: [created, updated, deactivated, reactivated]

    AuditEntityType:
      type: string
      enum: [user, department, topic, questionnaire, assignment]
      description: The kind of record. Employees are `user`. Assignments are only ever `created`.

    AuditChange:
      type: object
      description: One changed field, named as in this spec. Shared fields (`id`, `organizationId`, `createdAt`, `updatedAt`) and derived fields are never listed.
      required: [field, oldValue, newValue]
      properties:
        field:
          type: string
          description: The field name, for example `departmentId`.
        oldValue:
          description: Value before the change. Null for new records and for fields that had no value.
        newValue:
          description: Value after the change. Null when the field was cleared.

    AuditLogEntry:
      type: object
      description: |
        A record of an administrator action. Entries are written together with the change they record, and are never changed or deleted.

        Internal record: no endpoint returns it and there is no screen for it in the MVP. The rules for what is logged are in the business rules (developer guide, "Audit log").
      required: [id, organizationId, actorId, action, entityType, entityId, changes, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        organizationId:
          $ref: '#/components/schemas/Id'
        actorId:
          $ref: '#/components/schemas/Id'
          description: The administrator who did it.
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          $ref: '#/components/schemas/AuditEntityType'
        entityId:
          $ref: '#/components/schemas/Id'
        changes:
          type: array
          description: What changed. For `created`, every field with a value; for `updated`, only the changed fields; empty for `deactivated` and `reactivated`.
          items:
            $ref: '#/components/schemas/AuditChange'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: When the action happened.
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: Always equal to `createdAt`, because entries never change.
